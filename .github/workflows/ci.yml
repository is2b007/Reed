name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript, tests, and offline contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:runtime
      - name: Run test files serially
        run: pnpm exec vitest run --no-file-parallelism --maxWorkers=1
      - run: pnpm test:offline

  android:
    name: Android unit, lint, and APK build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint, and assemble
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK for device checks
        uses: actions/upload-artifact@v6
        with:
          name: reed-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

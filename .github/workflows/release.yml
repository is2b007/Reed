name: Signed release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source and offline contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:runtime
      - run: pnpm exec vitest run --no-file-parallelism --maxWorkers=1
      - run: pnpm test:offline

  macos:
    name: Sign and notarize macOS
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Without a Developer ID certificate the build is ad-hoc signed instead, so a release can still ship.
      SIGNED: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime
      - name: Import Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/reed-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/reed-build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/reed-build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/reed-build.keychain-db"
          security import "$RUNNER_TEMP/reed-signing.p12" -k "$RUNNER_TEMP/reed-build.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/reed-build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/reed-build.keychain-db"
      - name: Prepare App Store Connect API key
        if: env.SIGNED == 'true'
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          test -n "$API_KEY_BASE64"
          test -n "$API_KEY_ID"
          echo "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
      - name: Build signed and notarized app
        if: env.SIGNED == 'true'
        env:
          REED_RELEASE_SIGNING: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm desktop:make:mac
      - name: Build ad-hoc signed app
        if: env.SIGNED != 'true'
        run: pnpm desktop:make:mac
      - name: Normalize and verify artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release
          cp "$(find apps/editor/out/make -type f -name '*.dmg' -print -quit)" "release/Reed-$VERSION-macos-arm64.dmg"
          cp "$(find apps/editor/out/make -type f -name '*.zip' -print -quit)" "release/Reed-$VERSION-macos-arm64.zip"
          hdiutil verify "release/Reed-$VERSION-macos-arm64.dmg"
          codesign --verify --deep --strict --verbose=2 apps/editor/out/Reed-darwin-arm64/Reed.app
          if [ "$SIGNED" = "true" ]; then
            xcrun stapler validate apps/editor/out/Reed-darwin-arm64/Reed.app
            spctl --assess --type execute --verbose=4 apps/editor/out/Reed-darwin-arm64/Reed.app
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: reed-macos
          path: release/*
          if-no-files-found: error

  windows:
    name: Sign Windows
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      SIGNED: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime
      - name: Prepare signing certificate
        if: env.SIGNED == 'true'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\reed-signing.pfx", [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
      - name: Locate GitHub CLI
        shell: pwsh
        run: |
          $ghPath = (Get-Command gh).Source
          if (-not $ghPath) { throw "GitHub CLI is required in the Windows package" }
          "REED_GH_WINDOWS_PATH=$ghPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build signed app
        if: env.SIGNED == 'true'
        env:
          REED_RELEASE_SIGNING: "1"
          WINDOWS_CERTIFICATE_FILE: ${{ runner.temp }}\reed-signing.pfx
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm desktop:make:windows
      - name: Build unsigned app
        if: env.SIGNED != 'true'
        run: pnpm desktop:make:windows
      - name: Normalize and verify artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $zip = Get-ChildItem apps/editor/out/make -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "Windows ZIP was not produced" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item $zip.FullName "release/Reed-$version-windows-x64.zip"
          if ($env:SIGNED -ne "true") { Write-Host "No Windows certificate configured; shipping unsigned"; exit 0 }
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -Match 'x64' | Select-Object -Last 1).FullName
          if (-not $signtool) { throw "signtool.exe was not found" }
          Get-ChildItem apps/editor/out/Reed-win32-x64 -Recurse -Include *.exe,*.dll,*.node | ForEach-Object { & $signtool verify /pa /all /v $_.FullName; if ($LASTEXITCODE -ne 0) { throw "Invalid signature: $($_.FullName)" } }
      - uses: actions/upload-artifact@v6
        with:
          name: reed-windows
          path: release/*
          if-no-files-found: error

  android:
    name: Sign Android
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Android updates must keep one signing key, so without the release keystore the APK is left out
      # instead of shipping a throwaway-key build that cannot upgrade later.
      SIGNED: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        if: env.SIGNED == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        if: env.SIGNED == 'true'
      - name: Install Android SDK 36
        if: env.SIGNED == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare release keystore
        if: env.SIGNED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reed-release.jks"
      - name: Test, lint, and build signed APK and bundle
        if: env.SIGNED == 'true'
        working-directory: apps/android
        env:
          REED_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/reed-release.jks
          REED_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          REED_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          REED_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease
      - name: Normalize and verify artifacts
        if: env.SIGNED == 'true'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release
          cp apps/android/app/build/outputs/apk/release/app-release.apk "release/Reed-$VERSION-android.apk"
          cp apps/android/app/build/outputs/bundle/release/app-release.aab "release/Reed-$VERSION-android.aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release/Reed-$VERSION-android.apk"
          jarsigner -verify -verbose -certs "release/Reed-$VERSION-android.aab"
      - name: Note the missing Android build
        if: env.SIGNED != 'true'
        run: echo "::warning::ANDROID_RELEASE_KEYSTORE_BASE64 is not set, so this release has no Android APK."
      - uses: actions/upload-artifact@v6
        if: env.SIGNED == 'true'
        with:
          name: reed-android
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [macos, windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MAC_SIGNED: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 != '' }}
      WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum ./* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2; exit 1; }
          NOTES="$RUNNER_TEMP/release-notes.md"
          cp "docs/RELEASE_NOTES_$VERSION.md" "$NOTES"
          if [ "$MAC_SIGNED" != "true" ] || [ "$WINDOWS_SIGNED" != "true" ]; then
            {
              echo
              echo "## Installing unsigned builds"
              echo
              [ "$MAC_SIGNED" != "true" ] && echo "- macOS: this build is not notarized. The first time, right-click Reed in Applications and choose Open."
              [ "$WINDOWS_SIGNED" != "true" ] && echo "- Windows: this build is not code-signed. If SmartScreen warns, choose More info, then Run anyway."
            } >> "$NOTES"
          fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Reed $GITHUB_REF_NAME" --notes-file "$NOTES"

  itch:
    name: Publish itch.io channels
    needs: publish
    runs-on: ubuntu-latest
    env:
      HAS_BUTLER_KEY: ${{ secrets.BUTLER_API_KEY != '' }}
    steps:
      - name: Skip without an itch.io key
        if: env.HAS_BUTLER_KEY != 'true'
        run: echo "::warning::BUTLER_API_KEY is not set, so itch.io was not updated."
      - uses: actions/checkout@v7
        if: env.HAS_BUTLER_KEY == 'true'
      - uses: actions/download-artifact@v7
        if: env.HAS_BUTLER_KEY == 'true'
        with:
          path: release
          merge-multiple: true
      - name: Install official Butler build
        if: env.HAS_BUTLER_KEY == 'true'
        run: |
          curl -fsSL https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Publish signed builds
        if: env.HAS_BUTLER_KEY == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: maniadesign/reed
          REED_RELEASE_DIR: release
        run: REED_RELEASE_VERSION="$(node -p "require('./package.json').version")" ./scripts/publish-itch.sh

packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

allowBuilds:
  better-sqlite3: true
  esbuild: true
  electron: true
  fs-xattr: true
  macos-alias: true
overrides:
  "@electron/rebuild": 4.0.4
  # Security patches for transitive dependencies (pnpm audit --prod).
  "fast-uri@3": ^3.1.9
  "brace-expansion@1": ^1.1.21
  "brace-expansion@2": ^2.1.7
  "ip-address@10": ^10.7.5
  "hono@4": ^4.13.14
  "@hono/node-server@1": ^1.19.17
  "qs@6": ^6.17.1
  "proxy-addr@2": ^2.0.8
  "body-parser@2": ^2.4.0
  "uuid@8": ^11.1.1
minimumReleaseAgeExclude:
  - qs@6.17.1
